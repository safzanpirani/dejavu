name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS so the darwin binaries can be re-signed; Bun 1.4 can emit an invalid arm64 signature.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          test "$tag" = "$declared" || { echo "tag v$tag does not match package.json version $declared"; exit 1; }
      - name: Check
        run: |
          bun install --frozen-lockfile
          bun run check
      - name: Build
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=""
            [ "$target" = "windows-x64" ] && ext=".exe"
            bun build --compile --target="bun-$target" src/cli.ts --outfile "release/dejavu-$target$ext"
          done
          codesign --force --sign - release/dejavu-darwin-arm64 release/dejavu-darwin-x64
          ./release/dejavu-darwin-arm64 --version
      - name: Checksums
        run: |
          cd release
          shasum -a 256 dejavu-* > checksums.txt
          cat checksums.txt
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dejavu-*
            release/checksums.txt
          generate_release_notes: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publishes with the NPM_TOKEN secret when one is set, or through npm trusted publishing (OIDC)
      # once the package trusts this workflow. npm refuses session logins without a 2FA challenge.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$NODE_AUTH_TOKEN" ] && ! npm view "$name" name >/dev/null 2>&1; then
            echo "::notice::$name is not on npm yet and no NPM_TOKEN secret is set; skipping npm"
            exit 0
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            exit 0
          fi
          npm install -g npm@latest
          node scripts/npm-prepare.cjs release/checksums.txt
          npm publish --access public --provenance
