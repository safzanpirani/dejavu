name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the tag matches Cargo.toml and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dejavu") | .version')
          npm=$(node -p 'require("./package.json").version')
          test "$tag" = "$crate" || { echo "tag v$tag does not match Cargo.toml version $crate"; exit 1; }
          test "$tag" = "$npm" || { echo "tag v$tag does not match package.json version $npm"; exit 1; }
      - name: Test
        run: cargo test --locked -p dejavu

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: dejavu-darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - asset: dejavu-darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
          # musl links statically, so one Linux binary runs on any distribution.
          - asset: dejavu-linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - asset: dejavu-linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - asset: dejavu-windows-x64.exe
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p dejavu --target "${{ matrix.target }}"
      - name: Stage
        run: |
          mkdir -p dist
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/dejavu$ext" "dist/${{ matrix.asset }}"
      - name: Sign
        if: startsWith(matrix.target, 'aarch64-apple') || startsWith(matrix.target, 'x86_64-apple')
        run: codesign --force --sign - "dist/${{ matrix.asset }}"
      - name: Smoke test
        # macos-latest is arm64; the x64 build is not run there.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          version=$("./dist/${{ matrix.asset }}" --version)
          test "$version" = "${GITHUB_REF_NAME#v}" || { echo "binary reports $version"; exit 1; }
      - name: Check static linking
        if: contains(matrix.target, 'musl')
        run: file "dist/${{ matrix.asset }}" | tee /dev/stderr | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: dejavu-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          chmod +x dejavu-*
          ls -l
          test "$(ls dejavu-* | wc -l)" -eq 5 || { echo "expected 5 binaries"; exit 1; }
          sha256sum dejavu-* > checksums.txt
          cat checksums.txt
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dejavu-*
            release/checksums.txt
          generate_release_notes: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publishes with the NPM_TOKEN secret when one is set, or through npm trusted publishing (OIDC)
      # once the package trusts this workflow. npm refuses session logins without a 2FA challenge.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$NODE_AUTH_TOKEN" ] && ! npm view "$name" name >/dev/null 2>&1; then
            echo "::notice::$name is not on npm yet and no NPM_TOKEN secret is set; skipping npm"
            exit 0
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            exit 0
          fi
          npm install -g npm@latest
          node scripts/npm-prepare.cjs release/checksums.txt
          npm publish --access public --provenance
